LABEL arch64
TEXT HELP
Boot the ArchLingmo install medium on BIOS.
It allows you to install ArchLingmo or perform system maintenance.
ENDTEXT
MENU LABEL ArchLingmo install medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nouveau.modeset=1 cow_spacesize=1G copytoram=n console=tty0 console=ttyS0,115200n8 systemd.log_target=console systemd.log_level=info loglevel=4

LABEL arch64safe
TEXT HELP
Boot without kernel modesetting: for graphics cards that hang or show a black screen
(very new NVIDIA cards). The desktop uses the generic VESA driver.
ENDTEXT
MENU LABEL ArchLingmo - safe graphics (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset nouveau.modeset=0 cow_spacesize=1G copytoram=n console=tty0 systemd.log_level=info loglevel=4
