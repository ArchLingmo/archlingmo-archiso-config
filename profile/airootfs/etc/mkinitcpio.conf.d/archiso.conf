# No kms hook: it put every GPU driver with its firmware in the initramfs (182 MB, nvidia's
# alone 154 MiB), and the ISO went over GitHub's 2 GiB. udev loads them from the image
# right after, with the same firmware
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
MODULES_DECOMPRESS="yes"
